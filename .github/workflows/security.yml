name: Security

on:
  # main'e doğrudan push edilen bir secret'ı haftalık taramayı beklemeden yakalamak için
  push:
    branches: [main]
  pull_request:
  # Haftalık: kod değişmese de yeni CVE'ler, kurallar ve sızıntı imzaları çıkar.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Yalnızca yerini yenisi alan PR çalıştırmaları iptal edilir; main çalıştırmaları tamamlanır.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Tarayıcılar digest'e sabitlenmiş imajlardan çalışır; Dependabot bunları güncelleyemez,
# tag ve digest birlikte elle güncellenir.
env:
  SEMGREP_IMAGE: semgrep/semgrep:1.186.0@sha256:6e1b04340e60e910fbb4ddbf3c857ab0918f064417ad5ac530014ccb3cf8c8f1
  ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.32.0@sha256:3014cc8f68f663935f69b3c3e0e41f5ce102b268d97db13db0f62208747f860d
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

jobs:
  scan:
    name: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks tüm geçmişi tarar
          fetch-depth: 0
          persist-credentials: false

      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo:ro" "$GITLEAKS_IMAGE" git /repo --redact --no-banner -v

      # ERROR ve WARNING engeller. p/nextjs şu an boş bir kural seti; dolunca
      # kendiliğinden devreye girer.
      # Önceki tarayıcı başarısız olsa da sonrakiler çalışır; job yine kırmızı biter.
      - name: Semgrep
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src "$SEMGREP_IMAGE"
          semgrep scan --metrics=off --error
          --severity ERROR --severity WARNING
          --config p/typescript --config p/react --config p/nextjs --config p/github-actions

      # Token verilmez (PR job'ında secret yok): zizmor çevrimiçi denetimleri
      # (impostor commit, bilinen açıklı action) atlar, çevrimdışı denetimler çalışır.
      - name: zizmor
        if: ${{ !cancelled() }}
        run: docker run --rm -v "$PWD:/src:ro" "$ZIZMOR_IMAGE" --min-severity medium /src

      # package-lock.json'da düzeltmesi çıkmış high/critical açıklar (dev bağımlılıklar dahil).
      - name: Trivy (lockfile)
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm -v "$PWD:/src:ro" -w /src -v "$RUNNER_TEMP/trivy:/root/.cache" "$TRIVY_IMAGE"
          fs --scanners vuln --include-dev-deps
          --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 .

      # Yalnızca PR'da: PR'ın eklediği bağımlılıklarda high/critical açık varsa engeller.
      - name: Dependency review
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  # CycloneDX SBOM. PR'da gerek yok; main, schedule ve elle çalıştırmada üretilir.
  # Ruleset'te zorunlu kontrol değildir.
  sbom:
    name: sbom
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: CycloneDX SBOM
        run: >-
          docker run --rm -v "$PWD:/src" -w /src -v "$RUNNER_TEMP/trivy:/root/.cache" "$TRIVY_IMAGE"
          fs --format cyclonedx --output sbom.cdx.json .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30
